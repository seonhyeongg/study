<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Web Editor</title>
    <link rel="stylesheet" href="simple-web-editor-css.css" />
  </head>
  <body>
    <h2>Simple Web Editor</h2>

    <div id="toolbar">
      <button id="bold">Bold</button>
      <button id="italic">Italic</button>
      <button id="underline">Underline</button>
      <button id="insertOrderedList">Number List</button>
      <button id="insertUnorderedList">Bullet Point</button>
      <button id="createLink">Link</button>
      <button id="removeFormat">Clear</button>
    </div>

    <div id="editor" contenteditable="true">Edit text.</div>

    <div>
      <button id="showResult">HTML Result</button>
      <pre id="output"></pre>
    </div>

    <script src="simple-web-editor-script.js"></script>
  </body>
</html>
